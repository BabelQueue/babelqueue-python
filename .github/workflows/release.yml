name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build, test & publish to PyPI
    runs-on: ubuntu-latest
    # Recommended for PyPI Trusted Publishing — configure a "pypi" environment +
    # a trusted publisher on PyPI (repo BabelQueue/babelqueue-python, this workflow).
    environment: pypi
    # redis_layout (conformance 1.7.0) drives the real Lua scripts: a real redis:7 is mandatory,
    # exactly as in ci.yml's `conformance` job — without it the cases are reported as failures.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The pinned conformance release (ADR-0032). Keep identical to ci.yml.
      BQ_CONFORMANCE_VERSION: 1.7.0
      BQ_FETCH_SH_SHA256: 8bb6ba567b288fb0ac71a70fd17041b2503df119e01998d76fdad372570bf849
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC) — no API token needed
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify the vendored suite against the release asset
        run: |
          curl -fsSL -o "$RUNNER_TEMP/fetch.sh" \
            "https://raw.githubusercontent.com/BabelQueue/conformance/v${BQ_CONFORMANCE_VERSION}/fetch.sh"
          echo "${BQ_FETCH_SH_SHA256}  $RUNNER_TEMP/fetch.sh" | sha256sum -c -
          bash "$RUNNER_TEMP/fetch.sh" --check "$BQ_CONFORMANCE_VERSION" tests/conformance
          test "$(tr -d '[:space:]' < tests/conformance/CONFORMANCE_VERSION)" = "$BQ_CONFORMANCE_VERSION"

      - name: Install & test (writes results.json)
        env:
          BQ_CONFORMANCE_RESULTS: ${{ runner.temp }}/results.json
          # A real redis:7 is mandatory: no silent skip or fakeredis fallback (shared runner contract).
          BQ_REQUIRE_REDIS: "1"
          BABELQUEUE_TEST_REDIS: redis://localhost:6379/0
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev,celery,django,otel,redis]" opentelemetry-sdk jsonschema
          pytest
          test -s "$BQ_CONFORMANCE_RESULTS"  # the conformance run must have produced results.json

      - name: Validate results.json (schema, bindings, sections)
        run: python scripts/check_conformance_results.py "$RUNNER_TEMP/results.json" tests/conformance

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Or, with a token instead of trusted publishing:
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/results.json
          fail_on_unmatched_files: true
